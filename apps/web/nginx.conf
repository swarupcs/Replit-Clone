server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Client-side routing: unknown paths fall through to the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
