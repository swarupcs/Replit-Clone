# Which policy a request gets, decided from the ORIGINAL request URI.
#
# `map` rather than a `location ^~ /embed/` block, and the difference is not
# style. This is an SPA: every route falls through `try_files` to /index.html,
# and that internal rewrite RE-RUNS location matching. A request for
# /embed/abc therefore leaves the embed block and lands back in `location /`,
# picking up its headers -- so the obvious version served `frame-ancestors
# 'none'` on embeds and broke the entire feature, while testing correct in the
# dev server. `$request_uri` is the untouched original and survives the
# rewrite.
map $request_uri $rc_csp {
  # The IDE, the dashboard, the sign-in pages. Not something to put in a frame:
  # a page that could would be showing a real editor, carrying the reader's
  # real session, under markup of the framing site's choosing -- the file tree
  # and the Run button positioned under whatever it wants clicked.
  default   "frame-ancestors 'none'; base-uri 'self'; object-src 'none'";

  # An embed exists to be framed by pages this platform will never see. The
  # framing rule is dropped rather than loosened; everything else is kept.
  ~^/embed/ "base-uri 'self'; object-src 'none'";
}

# What browsers too old to read frame-ancestors understand. An empty value
# makes nginx omit the header, which is what an embed needs.
map $request_uri $rc_frame_options {
  default   "DENY";
  ~^/embed/ "";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Headers are repeated per location rather than set once at the server level
  # because nginx's `add_header` does NOT inherit into a block that adds any
  # header of its own -- so a single outer copy would silently vanish from
  # exactly the responses that need it most.

  # Client-side routing: unknown paths fall through to the SPA.
  location / {
    add_header Content-Security-Policy $rc_csp always;
    add_header X-Frame-Options $rc_frame_options always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deliberately NOT a full policy: no default-src or script-src. Monaco
    # loads its workers from blob: URLs and its TypeScript worker needs eval,
    # so a strict script policy here is a white editor rather than a secure
    # one. These are the directives that hold whatever the app does -- the same
    # line the preview proxy's own CSP already takes.
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    # Repeated for the reason given above: this block adds a header of its own,
    # so it inherits none.
    add_header X-Content-Type-Options "nosniff" always;
  }
}
