<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />

    <!-- plan.md §11.7. An installable shell, so a dropped connection on a
         train gives a degraded editor rather than the browser's error page. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#08090f" />
    <!-- iOS reads none of the manifest's icons; this is the one it takes. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="A browser IDE: edit, run, and preview projects in isolated containers."
    />
    <title>Playground — browser IDE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
