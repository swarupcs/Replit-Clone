# Development stack: Postgres only. Run the apps with `pnpm dev`.
# For the VM deployment see docker-compose.prod.yml.
services:
  postgres:
    image: postgres:17-alpine
    container_name: replit-clone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-replit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replit}
      POSTGRES_DB: ${POSTGRES_DB:-replit_clone}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-replit}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
