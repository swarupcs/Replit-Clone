# Development stack: Postgres only. Run the apps with `pnpm dev`.
# For the VM deployment see docker-compose.prod.yml.
services:
  postgres:
    image: postgres:17-alpine
    container_name: replit-clone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-replit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replit}
      POSTGRES_DB: ${POSTGRES_DB:-replit_clone}
    ports:
      # 5433 is deliberately avoided: on Windows it falls inside a
      # Hyper-V/WSL reserved range (netsh interface ipv4 show
      # excludedportrange protocol=tcp), and Docker cannot publish into one.
      # The container then runs healthy while the host port never binds, so
      # every connection is refused. 15432 sits outside those ranges.
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -d matters: without it pg_isready connects to a database named
      # after the user, which does not exist, and the log fills with FATALs.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-replit} -d ${POSTGRES_DB:-replit_clone}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
